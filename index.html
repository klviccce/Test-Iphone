<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#D4567F">
    <title>🌹 Météo Amorino</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="app-title">🌹 Amorino</h1>
            <button class="location-btn" id="locationBtn">📍 Ma position</button>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="cityInput" class="search-input" placeholder="Rechercher une ville...">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Chargement...</p>
        </div>

        <!-- Error Message -->
        <div class="error" id="error">
            <p class="error-message"></p>
        </div>

        <!-- Current Weather -->
        <div class="current-weather" id="currentWeather">
            <div class="city-name" id="cityName">--</div>
            <div class="weather-icon" id="weatherIcon">
                <!-- SVG Melting: Closed ball shape -->
                <svg viewBox="0 0 200 300" class="ice-cream-svg melting-ice" style="display:none;">
                    <!-- Cone -->
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
                    <pattern id="waffle-melting" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="20" y2="20" stroke="#8B4513" stroke-width="1"/>
                        <line x1="20" y1="0" x2="0" y2="20" stroke="#8B4513" stroke-width="1"/>
                    </pattern>
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="url(#waffle-melting)" opacity="0.3"/>

                    <!-- Closed ball - melting -->
                    <ellipse cx="100" cy="140" rx="40" ry="45" fill="#FF69B4" opacity="0.95"/>
                    <ellipse cx="95" cy="135" rx="35" ry="40" fill="#FF1493" opacity="0.9"/>
                    <ellipse cx="100" cy="130" rx="30" ry="35" fill="#D4567F" opacity="0.85"/>

                    <!-- Drip effects -->
                    <ellipse cx="85" cy="175" rx="8" ry="12" fill="#FF69B4" opacity="0.7"/>
                    <ellipse cx="115" cy="178" rx="6" ry="10" fill="#FF1493" opacity="0.7"/>
                    <ellipse cx="100" cy="180" rx="7" ry="11" fill="#D4567F" opacity="0.6"/>
                </svg>

                <!-- SVG Normal: Beautiful open rose -->
                <svg viewBox="0 0 200 300" class="ice-cream-svg normal-ice" style="display:none;">
                    <!-- Cone -->
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
                    <pattern id="waffle-normal" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="20" y2="20" stroke="#8B4513" stroke-width="1"/>
                        <line x1="20" y1="0" x2="0" y2="20" stroke="#8B4513" stroke-width="1"/>
                    </pattern>
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="url(#waffle-normal)" opacity="0.3"/>

                    <!-- Rose petals - outer layer -->
                    <ellipse cx="85" cy="140" rx="25" ry="35" fill="#FF69B4" opacity="0.9" transform="rotate(-30 85 140)"/>
                    <ellipse cx="115" cy="140" rx="25" ry="35" fill="#FF1493" opacity="0.9" transform="rotate(30 115 140)"/>
                    <ellipse cx="70" cy="160" rx="25" ry="35" fill="#FF69B4" opacity="0.9" transform="rotate(-60 70 160)"/>
                    <ellipse cx="130" cy="160" rx="25" ry="35" fill="#FF1493" opacity="0.9" transform="rotate(60 130 160)"/>

                    <!-- Rose petals - middle layer -->
                    <ellipse cx="90" cy="125" rx="20" ry="30" fill="#FF1493" opacity="0.95" transform="rotate(-15 90 125)"/>
                    <ellipse cx="110" cy="125" rx="20" ry="30" fill="#FF69B4" opacity="0.95" transform="rotate(15 110 125)"/>
                    <ellipse cx="80" cy="145" rx="20" ry="30" fill="#FF1493" opacity="0.95" transform="rotate(-45 80 145)"/>
                    <ellipse cx="120" cy="145" rx="20" ry="30" fill="#FF69B4" opacity="0.95" transform="rotate(45 120 145)"/>

                    <!-- Rose petals - inner layer -->
                    <ellipse cx="95" cy="115" rx="15" ry="25" fill="#FF1493" opacity="1" transform="rotate(-10 95 115)"/>
                    <ellipse cx="105" cy="115" rx="15" ry="25" fill="#D4567F" opacity="1" transform="rotate(10 105 115)"/>
                    <ellipse cx="100" cy="130" rx="18" ry="28" fill="#FF69B4" opacity="1"/>

                    <!-- Center -->
                    <circle cx="100" cy="110" r="12" fill="#C71585"/>
                </svg>

                <!-- SVG Frozen: Rose with ice crystals -->
                <svg viewBox="0 0 200 300" class="ice-cream-svg frozen-ice" style="display:none;">
                    <!-- Cone -->
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
                    <pattern id="waffle-frozen" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="20" y2="20" stroke="#8B4513" stroke-width="1"/>
                        <line x1="20" y1="0" x2="0" y2="20" stroke="#8B4513" stroke-width="1"/>
                    </pattern>
                    <path d="M 70 180 L 100 280 L 130 180 Z" fill="url(#waffle-frozen)" opacity="0.3"/>

                    <!-- Rose petals - outer layer (lighter, frozen) -->
                    <ellipse cx="85" cy="140" rx="25" ry="35" fill="#E8B5D8" opacity="0.95" transform="rotate(-30 85 140)"/>
                    <ellipse cx="115" cy="140" rx="25" ry="35" fill="#D8A5C8" opacity="0.95" transform="rotate(30 115 140)"/>
                    <ellipse cx="70" cy="160" rx="25" ry="35" fill="#E8B5D8" opacity="0.95" transform="rotate(-60 70 160)"/>
                    <ellipse cx="130" cy="160" rx="25" ry="35" fill="#D8A5C8" opacity="0.95" transform="rotate(60 130 160)"/>

                    <!-- Rose petals - middle layer -->
                    <ellipse cx="90" cy="125" rx="20" ry="30" fill="#D8A5C8" opacity="0.95" transform="rotate(-15 90 125)"/>
                    <ellipse cx="110" cy="125" rx="20" ry="30" fill="#E8B5D8" opacity="0.95" transform="rotate(15 110 125)"/>
                    <ellipse cx="80" cy="145" rx="20" ry="30" fill="#D8A5C8" opacity="0.95" transform="rotate(-45 80 145)"/>
                    <ellipse cx="120" cy="145" rx="20" ry="30" fill="#E8B5D8" opacity="0.95" transform="rotate(45 120 145)"/>

                    <!-- Rose petals - inner layer -->
                    <ellipse cx="95" cy="115" rx="15" ry="25" fill="#D8A5C8" opacity="1" transform="rotate(-10 95 115)"/>
                    <ellipse cx="105" cy="115" rx="15" ry="25" fill="#C895B8" opacity="1" transform="rotate(10 105 115)"/>
                    <ellipse cx="100" cy="130" rx="18" ry="28" fill="#E8B5D8" opacity="1"/>

                    <!-- Center -->
                    <circle cx="100" cy="110" r="12" fill="#B885A8"/>

                    <!-- Ice crystals -->
                    <!-- Crystal 1 - top left -->
                    <path d="M 60 105 L 65 110 L 60 115 L 55 110 Z" fill="#B0E5FF" opacity="0.9" stroke="#87CEEB" stroke-width="1"/>
                    <line x1="60" y1="105" x2="60" y2="115" stroke="#B0E5FF" stroke-width="1.5"/>
                    <line x1="55" y1="110" x2="65" y2="110" stroke="#B0E5FF" stroke-width="1.5"/>

                    <!-- Crystal 2 - top right -->
                    <path d="M 140 110 L 145 115 L 140 120 L 135 115 Z" fill="#B0E5FF" opacity="0.9" stroke="#87CEEB" stroke-width="1"/>
                    <line x1="140" y1="110" x2="140" y2="120" stroke="#B0E5FF" stroke-width="1.5"/>
                    <line x1="135" y1="115" x2="145" y2="115" stroke="#B0E5FF" stroke-width="1.5"/>

                    <!-- Crystal 3 - left side -->
                    <path d="M 50 145 L 55 150 L 50 155 L 45 150 Z" fill="#B0E5FF" opacity="0.9" stroke="#87CEEB" stroke-width="1"/>
                    <line x1="50" y1="145" x2="50" y2="155" stroke="#B0E5FF" stroke-width="1.5"/>
                    <line x1="45" y1="150" x2="55" y2="150" stroke="#B0E5FF" stroke-width="1.5"/>

                    <!-- Crystal 4 - right side -->
                    <path d="M 150 150 L 155 155 L 150 160 L 145 155 Z" fill="#B0E5FF" opacity="0.9" stroke="#87CEEB" stroke-width="1"/>
                    <line x1="150" y1="150" x2="150" y2="160" stroke="#B0E5FF" stroke-width="1.5"/>
                    <line x1="145" y1="155" x2="155" y2="155" stroke="#B0E5FF" stroke-width="1.5"/>

                    <!-- Small frost particles -->
                    <circle cx="75" cy="120" r="2" fill="#B0E5FF" opacity="0.8"/>
                    <circle cx="125" cy="125" r="2" fill="#B0E5FF" opacity="0.8"/>
                    <circle cx="90" cy="105" r="1.5" fill="#B0E5FF" opacity="0.7"/>
                    <circle cx="110" cy="108" r="1.5" fill="#B0E5FF" opacity="0.7"/>
                </svg>
            </div>
            <div class="temperature" id="temperature">--°</div>
            <div class="ice-cream-status" id="iceCreamStatus">--</div>
            <div class="weather-description" id="weatherDescription">--</div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-icon">💨</span>
                    <span class="detail-label">Vent</span>
                    <span class="detail-value" id="wind">-- km/h</span>
                </div>
                <div class="detail-item">
                    <span class="detail-icon">💧</span>
                    <span class="detail-label">Humidité</span>
                    <span class="detail-value" id="humidity">--%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-icon">🌡️</span>
                    <span class="detail-label">Ressenti</span>
                    <span class="detail-value" id="feelsLike">--°</span>
                </div>
            </div>
        </div>

        <!-- Forecast -->
        <div class="forecast-container" id="forecastContainer">
            <h2 class="forecast-title">Prévisions</h2>
            <div class="forecast-list" id="forecastList">
                <!-- Forecast items will be inserted here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
